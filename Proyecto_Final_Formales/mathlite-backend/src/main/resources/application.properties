# ===================================================================
# MathLite Interpreter — Application Configuration
# ===================================================================

spring.application.name=mathlite-backend

# --- Server ---
server.port=8080

# --- MongoDB Local ---
# Uses local MongoDB via Docker (see docker-compose.yml at repo root)
spring.data.mongodb.uri=mongodb://localhost:27017/mathlite

# --- CORS (para React en localhost:5173) ---
mathlite.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# --- Logging ---
logging.level.com.mathlite=DEBUG
logging.level.org.springframework.data.mongodb=INFO
