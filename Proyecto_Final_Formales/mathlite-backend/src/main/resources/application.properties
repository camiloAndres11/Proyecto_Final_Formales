# ===================================================================
# MathLite Interpreter — Application Configuration
# ===================================================================

spring.application.name=mathlite-backend

# --- Server ---
server.port=8080

# --- MongoDB Atlas ---
# IMPORTANTE: Reemplazar con tu connection string real de MongoDB Atlas
# Formato: mongodb+srv://<usuario>:<password>@<cluster>.mongodb.net/<database>
spring.data.mongodb.uri=mongodb+srv://USERNAME:PASSWORD@cluster0.xxxxx.mongodb.net/mathlite?retryWrites=true&w=majority
spring.data.mongodb.database=mathlite

# --- CORS (para React en localhost:5173) ---
mathlite.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# --- Logging ---
logging.level.com.mathlite=DEBUG
logging.level.org.springframework.data.mongodb=INFO
